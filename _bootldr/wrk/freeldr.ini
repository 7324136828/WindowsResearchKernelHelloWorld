; Example for a BIOS boot of an installed NT 5.2 system with a WRK kernel.
; Edit SystemPath and Kernel for your installation and matching kernel build.
; Disk indices are zero-based; partition indices are one-based.

[FREELOADER]
DefaultOS=WRK
TimeOut=10

[Display]
TitleText=Windows Research Kernel
MinimalUI=Yes

[Operating Systems]
WRK="Windows Research Kernel"

[WRK]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
; Illustrative filename: place this image in the installed System32 directory.
Kernel=wrk.exe
; Default filename; retain the HAL compatible with the installed system/kernel.
Hal=hal.dll
; Initial i386 non-PAE configuration with a COM1 kernel debugger.
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /SOS /NOPAE /NOEXECUTE=ALWAYSOFF
