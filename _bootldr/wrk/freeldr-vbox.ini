; FreeLoader menu template for the WRK VirtualBox packaging disc.
; SystemPath assumes Windows Server 2003 SP1 installed on the first hard
; disk's first partition; it MUST be changed to match the actual install
; layout (partition index is one-based). This disc cannot replace the OS.

[FREELOADER]
DefaultOS=WRK
TimeOut=30

[Display]
TitleText=Windows Research Kernel (x86)
MinimalUI=Yes

[Operating Systems]
WRK="WRK 1.2 x86 (requires Windows Server 2003 SP1)"
Windows2003="Windows Server 2003 SP1 (original kernel)"

[WRK]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Kernel=wrkx86.exe
Hal=halmacpi.dll
Options=/SOS /NOPAE /NOEXECUTE=ALWAYSOFF /FASTDETECT

[Windows2003]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options=/FASTDETECT
